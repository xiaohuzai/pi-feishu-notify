name: Probe Auto-Merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  probe:
    # 防递归：只在探针自己的 PR 上跑，probe PR（probe/head-*）不触发
    if: github.head_ref == 'test/probe-automerge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe direct-merge fallback (auto-merge refused on clean PR)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -x
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RUN_ID="${{ github.run_id }}"
          BASE="probe-target"
          HEAD="probe/head-$RUN_ID"
          git fetch origin "$BASE"
          git checkout -B "$HEAD" "origin/$BASE"
          echo "probe fallback" > probe-automerge.txt
          git add probe-automerge.txt
          git commit -m "probe: direct merge fallback test"
          git push origin "$HEAD"
          PR_URL=$(gh pr create --base "$BASE" --head "$HEAD" --title "probe: direct merge fallback (safe to ignore)" --body "Automated probe for release workflow merge fallback.")
          echo "probe PR: $PR_URL"
          # 与 release.yml 相同的策略：auto-merge 优先，失败（clean status）则直接合并
          if gh pr merge "$PR_URL" --auto --merge --delete-branch; then
            echo "Auto-merge enabled for $PR_URL"
          else
            echo "Auto-merge not applicable (PR already mergeable), merging directly"
            gh pr merge "$PR_URL" --merge --delete-branch
          fi
          STATE=""
          for i in $(seq 1 12); do
            STATE=$(gh pr view "$PR_URL" --json state --jq .state)
            echo "state=$STATE"
            [ "$STATE" = "MERGED" ] && break
            sleep 5
          done
          gh pr view "$PR_URL" --json state,url --jq '.state + " " + .url'
          if [ "$STATE" != "MERGED" ]; then
            echo "::error::merge probe did not merge (state=$STATE)"
            exit 1
          fi
          echo "PROBE OK"
