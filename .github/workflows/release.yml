name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.3.0），不填则使用 package.json 当前版本'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 固定从 main 发版：流程末尾会把版本号变更提交回 main
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: 校验 package.json 版本号
        id: check
        env:
          # 用 env 传递 dispatch 输入，避免把用户输入直接拼进 run 脚本（模板注入风险）
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          # 输入了版本号则 bump，否则用当前 package.json 版本
          if [ -n "$VERSION_INPUT" ]; then
            npm version "$VERSION_INPUT" --no-git-tag-version
          fi
          # 注意：不要在 $( ) 内用 \" 转义双引号，bash 会把它当字面量导致语法错误
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: 检查 npm 上是否已存在该版本
        run: |
          VERSION=${{ steps.check.outputs.version }}
          if npm view pi-feishu-notify@$VERSION version >/dev/null 2>&1; then
            echo "::error::版本 $VERSION 已存在于 npm，请换一个版本号"
            exit 1
          fi

      - name: 校验（typecheck + test）
        run: npm run typecheck && npm test

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 提交版本号变更并打 tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先提交版本号变更，再打 tag，保证 tag 指向真正发布的提交
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "无版本号变更，跳过提交与 PR"
            git tag v${{ steps.check.outputs.version }}
            git push origin v${{ steps.check.outputs.version }}
            exit 0
          fi
          git commit -m "chore: release v${{ steps.check.outputs.version }} [skip ci]"
          git tag v${{ steps.check.outputs.version }}
          git push origin v${{ steps.check.outputs.version }}
          # main 有 pull_request 规则，不能直推，改走 PR
          RELEASE_BRANCH="release/v${{ steps.check.outputs.version }}"
          git branch -f "$RELEASE_BRANCH"
          git push origin "$RELEASE_BRANCH"
          gh pr create --base main --head "$RELEASE_BRANCH" \
            --title "chore: release v${{ steps.check.outputs.version }}" \
            --body "由 Release 工作流自动创建：更新 package.json / package-lock.json 版本号。请 review 后合并。" || echo "PR 创建失败或已存在，请手动检查"
