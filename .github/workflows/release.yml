name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.3.0). Leave empty to use the current package.json version'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 固定从 main 发版：流程末尾会把版本号变更提交回 main
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify package.json version
        id: check
        env:
          # 用 env 传递 dispatch 输入，避免把用户输入直接拼进 run 脚本（模板注入风险）
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          # 输入了版本号则 bump，否则用当前 package.json 版本
          # --allow-same-version：输入版本 == 当前版本时 npm version 会报 "Version not changed" 并退出 1，
          # 加此选项让流程继续（适用 main 已把版本号写好、只需发布 + 打 tag 的场景）
          if [ -n "$VERSION_INPUT" ]; then
            npm version "$VERSION_INPUT" --no-git-tag-version --allow-same-version
          fi
          # 注意：不要在 $( ) 内用 \" 转义双引号，bash 会把它当字面量导致语法错误
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already exists on npm
        run: |
          VERSION=${{ steps.check.outputs.version }}
          if npm view pi-feishu-notify@$VERSION version >/dev/null 2>&1; then
            echo "::error::Version $VERSION already exists on npm, pick a different version"
            exit 1
          fi

      - name: Verify (typecheck + test)
        run: npm run typecheck && npm test

      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 先提交版本号变更，再打 tag，保证 tag 指向真正发布的提交
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No version change, skipping commit and PR"
            git tag v${{ steps.check.outputs.version }}
            git push origin v${{ steps.check.outputs.version }}
            exit 0
          fi
          git commit -m "chore: release v${{ steps.check.outputs.version }} [skip ci]"
          git tag v${{ steps.check.outputs.version }}
          git push origin v${{ steps.check.outputs.version }}
          # main 有 pull_request 规则，不能直推，改走 PR
          RELEASE_BRANCH="release/v${{ steps.check.outputs.version }}"
          git branch -f "$RELEASE_BRANCH"
          git push origin "$RELEASE_BRANCH"
          gh pr create --base main --head "$RELEASE_BRANCH" \
            --title "chore: release v${{ steps.check.outputs.version }}" \
            --body "Created automatically by the Release workflow: updates package.json / package-lock.json versions. Please review and merge." || echo "PR creation failed or already exists, please check manually"
