name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.3.0). Leave empty to use the current package.json version'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # 固定从 main 发版：流程末尾会把版本号变更提交回 main
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - name: Verify package.json version
        id: check
        env:
          # 用 env 传递 dispatch 输入，避免把用户输入直接拼进 run 脚本（模板注入风险）
          VERSION_INPUT: ${{ github.event.inputs.version }}
        run: |
          # 输入了版本号则 bump，否则用当前 package.json 版本
          # --allow-same-version：输入版本 == 当前版本时 npm version 会报 "Version not changed" 并退出 1，
          # 加此选项让流程继续（适用重跑 / main 已把版本号写好、只需发布 + 打 tag 的场景）
          if [ -n "$VERSION_INPUT" ]; then
            npm version "$VERSION_INPUT" --no-git-tag-version --allow-same-version
          fi
          # 注意：不要在 $( ) 内用 \" 转义双引号，bash 会把它当字面量导致语法错误
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 已发布过的版本跳过 publish（失败重跑安全：npm 版本号不可覆盖，重跑只补 tag / 版本号 PR）
          if npm view "pi-feishu-notify@$VERSION" version >/dev/null 2>&1; then
            echo "exists_on_npm=true" >> "$GITHUB_OUTPUT"
            echo "Version $VERSION already exists on npm — will skip publish (idempotent re-run)"
            exit 0
          fi
          echo "exists_on_npm=false" >> "$GITHUB_OUTPUT"
          # 防呆：未发布的新版本必须高于 npm latest。发旧版本会让 npm 把 latest 标签指回旧版
          NPM_LATEST=$(npm view pi-feishu-notify version 2>/dev/null || echo "0.0.0")
          LOWEST=$(printf '%s\n%s\n' "$NPM_LATEST" "$VERSION" | sort -V | head -n 1)
          if [ "$LOWEST" = "$VERSION" ]; then
            echo "::error::Version $VERSION is not higher than the published latest ($NPM_LATEST) — 发旧版本会把 npm latest 标签指回旧版"
            exit 1
          fi

      - name: Verify (typecheck + test)
        run: npm run typecheck && npm test

      - name: Publish to npm
        # 该版本已在 npm 上（重跑 / 补 tag 场景）则跳过，保证 workflow 可安全重跑
        if: steps.check.outputs.exists_on_npm != 'true'
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump and tag
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RELEASE_BRANCH="release/v$VERSION"
          # 先提交版本号变更，再打 tag，保证 tag 指向真正发布的提交
          git add package.json package-lock.json
          PR_NEEDED=false
          if git diff --cached --quiet; then
            echo "No version change, skipping commit"
          else
            # 刻意不带 [skip ci]：版本号 PR 要靠 pull_request CI 产出 main ruleset
            # 所需的 Test 必需检查，门禁才过得去
            git commit -m "chore: release v$VERSION"
            PR_NEEDED=true
          fi
          # tag / release 分支都做成幂等：重跑时已存在则复用，不报错
          if git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "Tag v$VERSION already exists on remote, reusing"
          else
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          if [ "$PR_NEEDED" = "true" ]; then
            # main 有 pull_request 规则，不能直推，改走 PR；release/* 是 bot 分支，允许强推以保证重跑收敛
            git push origin "HEAD:refs/heads/$RELEASE_BRANCH" --force
          fi
          echo "pr_needed=$PR_NEEDED" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          # 基于刚 push 的 tag 建 Release，changelog 自动生成；重复运行时跳过已存在的 Release
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists, skipping"
            exit 0
          fi
          gh release create "v$VERSION" \
            --title "v$VERSION" \
            --generate-notes

      # 版本号 PR 自动建、自动合——仅对该 PR 开启 auto-merge（dev→main 等常规 PR 仍走人工）。
      # 放在最后一步：前面 npm / tag / Release 都已落地，本步失败不影响已发布的产物。
      - name: Open version bump PR and auto-merge
        if: steps.bump.outputs.pr_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          RELEASE_BRANCH="release/v$VERSION"
          PR_URL=$(gh pr list --base main --head "$RELEASE_BRANCH" --state open --json url --jq '.[0].url')
          if [ -z "$PR_URL" ]; then
            if gh pr list --base main --head "$RELEASE_BRANCH" --state merged --json number --jq '.[0].number' | grep -q '[0-9]'; then
              echo "Version bump PR already merged, nothing to do."
              exit 0
            fi
            PR_URL=$(gh pr create --base main --head "$RELEASE_BRANCH" \
              --title "chore: release v$VERSION" \
              --body "Created automatically by the Release workflow: updates package.json / package-lock.json versions. Auto-merged by the workflow (only version-only PRs are); no manual action needed.") \
              || { echo "::error::Failed to create version bump PR for branch $RELEASE_BRANCH — 请手动创建并合并（npm $VERSION 已发布）"; exit 1; }
          fi
          echo "Version bump PR: $PR_URL"
          # 安全阀：只自动合入「仅改版本号」的 PR，混入其它变更就停下交人工审查
          EXTRA=$(gh pr diff "$PR_URL" --name-only | grep -cvE '^(package\.json|package-lock\.json)$' || true)
          if [ "$EXTRA" -ne 0 ]; then
            echo "::error::PR $PR_URL 除版本号外还有其它变更，已停止自动合并，请人工审查"
            exit 1
          fi
          # 版本提交不带 [skip ci]，PR 会照常跑 pull_request CI 产出 Test 必需检查
          # （workflow_dispatch 手动补的检查不计入 PR 门禁，实测无效，勿走回头路）

          # auto-merge：有必需检查在跑时 --auto 可用，GitHub 在 Test 通过后自动合入；
          # 若 PR 已就绪（检查已过），--auto 被拒（clean status）→ 直接合并兜底
          AUTO=0
          for i in $(seq 1 120); do
            STATE=$(gh pr view "$PR_URL" --json state --jq .state)
            if [ "$STATE" = "MERGED" ]; then
              echo "Version bump PR merged automatically: $PR_URL"
              exit 0
            fi
            if [ "$AUTO" = 0 ]; then
              if gh pr merge "$PR_URL" --auto --merge --delete-branch >/dev/null 2>&1; then
                AUTO=1
                echo "Auto-merge enabled for $PR_URL"
              else
                gh pr merge "$PR_URL" --merge --delete-branch >/dev/null 2>&1 \
                  && { echo "Version bump PR merged directly: $PR_URL"; exit 0; }
              fi
            fi
            # 检查失败则提前报错（auto-merge 永远不会完成），不装死
            if gh pr checks "$PR_URL" 2>/dev/null | grep -qw fail; then
              echo "::error::CI 检查未通过，版本号 PR 无法自动合入。npm $VERSION 已发布成功，请修复后手动合并：$PR_URL"
              gh pr checks "$PR_URL" || true
              exit 1
            fi
            sleep 5
          done
          echo "::error::版本号 PR 未自动合入（state=$STATE）。npm $VERSION 已发布成功，请手动合并：$PR_URL"
          gh pr checks "$PR_URL" || true
          exit 1
