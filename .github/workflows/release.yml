name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 0.8.0). Leave empty to use the current package.json version'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    uses: xiaohuzai/release-flow/.github/workflows/release.yml@8083ee4e81ad993c1e0c397426fbaaa743b6381e
    with:
      version: ${{ inputs.version }}
    secrets: inherit
