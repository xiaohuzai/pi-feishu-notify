name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    # job 名即 check 上下文名——main ruleset 的 required_status_checks 按 "Test" 匹配
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
